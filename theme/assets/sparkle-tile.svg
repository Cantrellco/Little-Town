<?xml version="1.0" encoding="UTF-8"?>
<!-- Faint, tiling sparkle texture for the Memberships hero — sparse and
     subtle, matching the Fusion coffee-bean tile's three-motif recipe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130" role="presentation" aria-hidden="true">
  <g opacity="0.18" fill="#a8472a">
    <!-- four-point sparkle -->
    <path transform="translate(34 38)" d="M0 -10 q1.6 8 10 10 q-8.4 1.6 -10 10 q-1.6 -8.4 -10 -10 q8.4 -1.6 10 -10Z"/>
    <!-- smaller sparkle -->
    <path transform="translate(96 70) scale(0.7)" d="M0 -10 q1.6 8 10 10 q-8.4 1.6 -10 10 q-1.6 -8.4 -10 -10 q8.4 -1.6 10 -10Z"/>
    <!-- 5-point star -->
    <path transform="translate(60 104) rotate(8)" d="M0 -8 L2.4 -2.4 L8 -2.4 L3.4 1.4 L5.2 7 L0 3.6 L-5.2 7 L-3.4 1.4 L-8 -2.4 L-2.4 -2.4 Z"/>
  </g>
</svg>
