<?xml version="1.0" encoding="UTF-8"?>
<!-- Memberships hero art — a polished "VIP All-Access" pass with a
     hole-punch eyelet at the top. Hand-illustrated to match the Fusion
     latte mug: coffee-brown stroke (#8A5A2C), warm-cream highlights,
     soft cast shadow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Little Town Playhouse all-access VIP pass">
  <defs>
    <linearGradient id="passGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FBE6BD"/>
      <stop offset="0.55" stop-color="#EBC078"/>
      <stop offset="1"    stop-color="#D8945B"/>
    </linearGradient>
    <radialGradient id="medGrad" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#FFF4D8"/>
      <stop offset="1" stop-color="#F0CD83"/>
    </radialGradient>
  </defs>

  <!-- soft floor shadow under the whole pass -->
  <ellipse cx="170" cy="210" rx="96" ry="5" fill="#3a2c20" opacity="0.18"/>

  <!-- ============================================================
       CARD (rotated as one group)
       ============================================================ -->
  <g transform="rotate(-3 160 124)">
    <!-- pass body -->
    <rect x="58" y="56" width="204" height="148" rx="16" fill="url(#passGrad)" stroke="#8A5A2C" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- inner dashed frame — gives an "official" pass feel -->
    <rect x="66" y="64" width="188" height="132" rx="11" fill="none" stroke="#8A5A2C" stroke-width="1.1" stroke-dasharray="2 4" opacity="0.55"/>

    <!-- VIP MEMBER eyebrow (top) -->
    <text x="160" y="92" font-family="Fraunces, Georgia, serif" font-size="10" font-weight="700" letter-spacing="4" fill="#8A5A2C" text-anchor="middle">VIP MEMBER</text>

    <!-- star medallion -->
    <g transform="translate(160 132)">
      <!-- coin -->
      <circle r="30" fill="url(#medGrad)" stroke="#8A5A2C" stroke-width="2.4"/>
      <!-- inner dashed ring -->
      <circle r="24" fill="none" stroke="#A8472A" stroke-width="0.9" stroke-dasharray="1.5 2.5" opacity="0.7"/>
      <!-- clean 5-point star -->
      <path d="M0 -18 L4.41 -6.07 L17.12 -5.56 L7.13 2.32 L10.58 14.56 L0 7.5 L-10.58 14.56 L-7.13 2.32 L-17.12 -5.56 L-4.41 -6.07 Z" fill="#A8472A" stroke="#5a2f1c" stroke-width="0.9" stroke-linejoin="round"/>
      <!-- shine glint on the star -->
      <path d="M-6 -10 L-2 -4 L-8 -3 Z" fill="#FBF5EA" opacity="0.55"/>
    </g>

    <!-- ALL ACCESS title -->
    <text x="160" y="184" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="700" letter-spacing="3.4" fill="#5a2f1c" text-anchor="middle">ALL ACCESS</text>

    <!-- subbrand line -->
    <text x="160" y="196" font-family="Quicksand, sans-serif" font-size="6.4" font-weight="600" letter-spacing="2.4" fill="#8A5A2C" text-anchor="middle">LITTLE TOWN · PLAYHOUSE</text>

    <!-- subtle gloss along the upper third -->
    <path d="M58 76 q102 -12 204 4 V104 q-102 -14 -204 4 Z" fill="#FBF5EA" opacity="0.16"/>

    <!-- small sparkles ON the card -->
    <path d="M82 102 l1.1 3 l3.2 0.3 l-2.4 2 l0.8 3 l-2.7 -1.7 l-2.7 1.7 l0.8 -3 l-2.4 -2 l3.2 -0.3 Z" fill="#FBF5EA" opacity="0.95"/>
    <path d="M238 168 l1 2.6 l2.8 0.3 l-2.1 1.7 l0.7 2.6 l-2.4 -1.5 l-2.4 1.5 l0.7 -2.6 l-2.1 -1.7 l2.8 -0.3 Z" fill="#FBF5EA" opacity="0.85"/>
  </g>

  <!-- ambient sparkles outside the pass -->
  <path d="M40 64 l1.1 3 l3.2 0.3 l-2.4 2 l0.8 3.1 l-2.7 -1.7 l-2.7 1.7 l0.8 -3.1 l-2.4 -2 l3.2 -0.3 Z" fill="#FBF5EA" opacity="0.9"/>
  <path d="M288 168 l1.3 3.4 l3.6 0.4 l-2.7 2.2 l0.9 3.4 l-3.1 -1.9 l-3.1 1.9 l0.9 -3.4 l-2.7 -2.2 l3.6 -0.4 Z" fill="#FBF5EA" opacity="0.85"/>
</svg>
