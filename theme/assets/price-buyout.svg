<?xml version="1.0" encoding="UTF-8"?>
<!-- Private Buyout hero art — a warm "private party" invite card.
     Same hand-illustrated family as price-membership.svg: warm gold card,
     clay-brown linework (#8A5A2C), Fraunces wordmark, signature 4-point
     sparkles, soft cast shadow, slight tilt. Themed for a party buyout with
     a balloon cluster rising over the card and bunting-palette confetti.
     Price-agnostic on purpose: one image serves both $185 / $295 tiers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Little Town private party buyout card">
  <defs>
    <linearGradient id="bo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FBE7BE"/>
      <stop offset="0.55" stop-color="#F0C97E"/>
      <stop offset="1"    stop-color="#E0A35F"/>
    </linearGradient>
    <radialGradient id="bo-badge" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#FFF6DE"/>
      <stop offset="1" stop-color="#F0CD83"/>
    </radialGradient>
    <radialGradient id="bo-coral" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F8C9BF"/>
      <stop offset="55%" stop-color="#EC9A90"/>
      <stop offset="100%" stop-color="#C77264"/>
    </radialGradient>
    <radialGradient id="bo-gold" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FCEAB6"/>
      <stop offset="55%" stop-color="#F4C969"/>
      <stop offset="100%" stop-color="#D99B3E"/>
    </radialGradient>
    <radialGradient id="bo-blue" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#DDF0F6"/>
      <stop offset="55%" stop-color="#AEDCEA"/>
      <stop offset="100%" stop-color="#7FBCCE"/>
    </radialGradient>
  </defs>

  <!-- ambient confetti (bunting palette, kept to the corners) -->
  <g opacity="0.9">
    <rect x="36" y="40" width="11" height="15" rx="2" fill="#F8D98F" transform="rotate(18 41 47)"/>
    <polygon points="60,96 72,96 66,85" fill="#BFD6A8"/>
    <circle cx="44" cy="120" r="4.5" fill="#AEDCEA"/>
    <rect x="312" y="120" width="11" height="15" rx="2" fill="#F4AE92" transform="rotate(-16 317 127)"/>
    <circle cx="332" cy="86" r="4.5" fill="#EC9A90"/>
    <polygon points="300,250 312,250 306,239" fill="#F8D98F"/>
    <circle cx="52" cy="252" r="4.5" fill="#F4AE92"/>
  </g>

  <!-- soft cast shadow under the card -->
  <ellipse cx="180" cy="282" rx="120" ry="8" fill="#3a2c20" opacity="0.16"/>

  <!-- card group (tilted as one) -->
  <g transform="rotate(-3 180 188)">
    <!-- body -->
    <rect x="40" y="108" width="280" height="160" rx="22" fill="url(#bo-bg)" stroke="#8A5A2C" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- top gloss -->
    <ellipse cx="138" cy="138" rx="104" ry="22" fill="#FBF5EA" opacity="0.14"/>

    <!-- emblem badge + signature sparkle -->
    <circle cx="80" cy="150" r="21" fill="url(#bo-badge)" stroke="#8A5A2C" stroke-width="2"/>
    <path transform="translate(63.8 137.9) scale(1.35)" d="M12 2c.5 4.5 2.5 6.5 7 7-4.5.5-6.5 2.5-7 7-.5-4.5-2.5-6.5-7-7 4.5-.5 6.5-2.5 7-7Z" fill="#C77F2E"/>
    <path transform="translate(63.8 137.9) scale(1.35)" d="M12 6c.3 2.5 1.5 3.7 4 4-2.5.3-3.7 1.5-4 4-.3-2.5-1.5-3.7-4-4 2.5-.3 3.7-1.5 4-4Z" fill="#FBF5EA" opacity="0.75"/>

    <!-- brand wordmark -->
    <text x="116" y="146" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#5a2f1c">Private Party</text>
    <text x="117" y="164" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.4" fill="#8A5A2C" opacity="0.82">LITTLE TOWN PLAYHOUSE</text>

    <!-- divider -->
    <line x1="62" y1="184" x2="298" y2="184" stroke="#8A5A2C" stroke-width="1.2" opacity="0.26"/>

    <!-- perk: balloon + benefit -->
    <g transform="translate(64 196)">
      <ellipse cx="9" cy="8" rx="6.2" ry="7.2" fill="#D9663D" stroke="#8A5A2C" stroke-width="1.3"/>
      <ellipse cx="6.6" cy="5.2" rx="1.5" ry="2.2" fill="#FBF5EA" opacity="0.6"/>
      <path d="M9 15.2 l-1.3 1.7 l2.6 0 Z" fill="#A8472A" stroke="#8A5A2C" stroke-width="1" stroke-linejoin="round"/>
      <path d="M9 17 q2.8 2.8 -1 5.2" fill="none" stroke="#8A5A2C" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <text x="92" y="210" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#5a2f1c">The whole place — just for you</text>

    <!-- footer row -->
    <text x="62" y="246" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8A5A2C" opacity="0.9">TWO PRIVATE HOURS</text>
    <text x="262" y="246" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B35A37">2026</text>

    <!-- small sparkle on the card -->
    <path d="M274 198 l1 2.7 l2.9 0.3 l-2.2 1.8 l0.7 2.7 l-2.4 -1.6 l-2.4 1.6 l0.7 -2.7 l-2.2 -1.8 l2.9 -0.3 Z" fill="#FBF5EA" opacity="0.9"/>
  </g>

  <!-- balloon cluster rising over the card's top-right -->
  <g>
    <!-- ribbons trailing down toward the card -->
    <path d="M236 78 q4 18 8 30"   fill="none" stroke="#cdb89a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M278 70 q-6 20 -28 38" fill="none" stroke="#cdb89a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M258 100 q-2 8 -6 14"  fill="none" stroke="#cdb89a" stroke-width="1.8" stroke-linecap="round"/>

    <!-- gold balloon (back) -->
    <ellipse cx="278" cy="44" rx="21" ry="26" fill="url(#bo-gold)"/>
    <ellipse cx="271" cy="35" rx="5.5" ry="9" fill="#ffffff" opacity="0.5"/>
    <path d="M278 69 l-4.5 6 l9 0 Z" fill="#C98A35"/>

    <!-- coral balloon (back-left) -->
    <ellipse cx="236" cy="52" rx="20" ry="25" fill="url(#bo-coral)"/>
    <ellipse cx="229" cy="43" rx="5" ry="8.5" fill="#ffffff" opacity="0.5"/>
    <path d="M236 76 l-4.5 6 l9 0 Z" fill="#B05E50"/>

    <!-- blue balloon (front) -->
    <ellipse cx="258" cy="72" rx="22" ry="27" fill="url(#bo-blue)"/>
    <ellipse cx="250" cy="62" rx="5.5" ry="9" fill="#ffffff" opacity="0.55"/>
    <path d="M258 98 l-4.5 6 l9 0 Z" fill="#6FA9BB"/>
  </g>

  <!-- ambient sparkles outside the card -->
  <path d="M40 92 l1.1 3 l3.2 0.3 l-2.4 2 l0.8 3.1 l-2.7 -1.7 l-2.7 1.7 l0.8 -3.1 l-2.4 -2 l3.2 -0.3 Z" fill="#F4AE92" opacity="0.9"/>
  <path d="M318 232 l1.2 3.2 l3.4 0.4 l-2.6 2.1 l0.85 3.2 l-2.9 -1.8 l-2.9 1.8 l0.85 -3.2 l-2.6 -2.1 l3.4 -0.4 Z" fill="#AEDCEA" opacity="0.85"/>
  <path d="M206 28 l1 2.7 l2.9 0.3 l-2.2 1.8 l0.7 2.7 l-2.4 -1.6 l-2.4 1.6 l0.7 -2.7 l-2.2 -1.8 l2.9 -0.3 Z" fill="#BFD6A8" opacity="0.9"/>
</svg>
