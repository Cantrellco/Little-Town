  <g fill="#ffffff">
    <circle cx="60" cy="30" r="18"/>
    <circle cx="39" cy="34" r="16"/>
    <circle cx="81" cy="34" r="16"/>
    <circle cx="23" cy="41" r="12"/>
    <circle cx="97" cy="41" r="12"/>
    <circle cx="34" cy="43" r="12"/>
    <circle cx="86" cy="43" r="12"/>
    <circle cx="49" cy="43" r="15"/>
    <circle cx="71" cy="43" r="15"/>
    <circle cx="60" cy="41" r="15"/>
  </g>
</svg>
