<?xml version="1.0" encoding="UTF-8"?>
<!-- Faint, tiling photo-gallery texture — a single camera motif repeated 3x,
     matching the Fusion coffee-bean tile's recipe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130" role="presentation" aria-hidden="true">
  <g opacity="0.16" fill="#B65D45">
    <g transform="translate(34 38) rotate(-10)">
      <rect x="-13" y="-7" width="26" height="17" rx="3"/>
      <rect x="-5" y="-11" width="10" height="4.5" rx="1.4"/>
      <circle cx="0" cy="1.5" r="5.5" fill="#fff" opacity="0.45"/>
      <circle cx="0" cy="1.5" r="3"/>
    </g>
    <g transform="translate(96 70) rotate(14)">
      <rect x="-13" y="-7" width="26" height="17" rx="3"/>
      <rect x="-5" y="-11" width="10" height="4.5" rx="1.4"/>
      <circle cx="0" cy="1.5" r="5.5" fill="#fff" opacity="0.45"/>
      <circle cx="0" cy="1.5" r="3"/>
    </g>
    <g transform="translate(60 104) rotate(-6)">
      <rect x="-13" y="-7" width="26" height="17" rx="3"/>
      <rect x="-5" y="-11" width="10" height="4.5" rx="1.4"/>
      <circle cx="0" cy="1.5" r="5.5" fill="#fff" opacity="0.45"/>
      <circle cx="0" cy="1.5" r="3"/>
    </g>
  </g>
</svg>
