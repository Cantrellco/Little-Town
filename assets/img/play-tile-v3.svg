<?xml version="1.0" encoding="UTF-8"?>
<!-- Faint, tiling "play" texture — a single toy-block motif repeated 3x at
     different rotations, matching the Fusion coffee-bean tile's recipe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130" role="presentation" aria-hidden="true">
  <g opacity="0.16" fill="#3B7E94">
    <g transform="translate(34 38) rotate(-12)">
      <rect x="-10" y="-10" width="20" height="20" rx="3.5"/>
      <rect x="-6" y="-6" width="5" height="5" rx="1" fill="#fff" opacity="0.45"/>
    </g>
    <g transform="translate(96 70) rotate(18)">
      <rect x="-10" y="-10" width="20" height="20" rx="3.5"/>
      <rect x="-6" y="-6" width="5" height="5" rx="1" fill="#fff" opacity="0.45"/>
    </g>
    <g transform="translate(60 104) rotate(-6)">
      <rect x="-10" y="-10" width="20" height="20" rx="3.5"/>
      <rect x="-6" y="-6" width="5" height="5" rx="1" fill="#fff" opacity="0.45"/>
    </g>
  </g>
</svg>
