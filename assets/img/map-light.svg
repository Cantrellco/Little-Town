<?xml version="1.0" encoding="UTF-8"?>
<!-- Visit Us — stylized illustrated map (polished). NOT a real map; final: embed a live map. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Stylized illustrated map showing Little Town Playhouse on Main Street.">
  <rect width="600" height="380" fill="#e8eede"/>
  <!-- park -->
  <rect x="40" y="40" width="150" height="118" rx="16" fill="#cfe0bd"/>
  <circle cx="78" cy="78" r="15" fill="#9CB082"/><circle cx="120" cy="118" r="19" fill="#9CB082"/><circle cx="150" cy="68" r="13" fill="#a7bb8e"/>
  <!-- water -->
  <path d="M0 300 Q150 270 300 300 T600 290 V380 H0 Z" fill="#cfe1dd"/>
  <path d="M0 318 Q150 290 300 318 T600 308" fill="none" stroke="#bcd6d1" stroke-width="3" opacity="0.7"/>
  <!-- roads -->
  <rect x="0" y="188" width="600" height="42" fill="#F7F3EC"/>
  <rect x="258" y="0" width="40" height="380" fill="#F7F3EC"/>
  <line x1="0" y1="209" x2="600" y2="209" stroke="#e3d8c2" stroke-width="3" stroke-dasharray="16 13"/>
  <line x1="278" y1="0" x2="278" y2="380" stroke="#e3d8c2" stroke-width="3" stroke-dasharray="16 13"/>
  <!-- blocks -->
  <g fill="#efe7d8">
    <rect x="330" y="58" width="92" height="92" rx="12"/><rect x="448" y="58" width="112" height="92" rx="12"/>
    <rect x="330" y="250" width="92" height="92" rx="12"/><rect x="42" y="250" width="170" height="58" rx="12"/>
  </g>
  <g fill="#e6dcc6" opacity="0.7">
    <rect x="346" y="74" width="26" height="26" rx="4"/><rect x="384" y="74" width="22" height="40" rx="4"/>
    <rect x="466" y="74" width="34" height="26" rx="4"/><rect x="512" y="74" width="32" height="40" rx="4"/>
  </g>
  <!-- label -->
  <text x="118" y="216" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#a99a7d">MAIN STREET</text>
  <!-- pin -->
  <g transform="translate(278,182)">
    <ellipse cx="0" cy="36" rx="17" ry="5" fill="#7a5a2e" opacity="0.25"/>
    <g>
