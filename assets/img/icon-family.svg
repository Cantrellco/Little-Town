<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="">
  <!-- Three siblings — for the "3+ Children" tier. Graduated heights, brand
       palette (gold / coral / sage), clay-brown linework. Center child drawn
       last so it reads in front of the two on either side. -->
  <g stroke="#8A5A2C" stroke-width="1.3" stroke-linejoin="round">
    <!-- left child (gold) -->
    <path d="M2.6 21 q0 -8 3.2 -8 q3.2 0 3.2 8 Z" fill="#E7BC76"/>
    <circle cx="5.8" cy="10.8" r="2.6" fill="#E7BC76"/>
    <!-- right child (sage) -->
    <path d="M15 21 q0 -8 3.2 -8 q3.2 0 3.2 8 Z" fill="#ABBE83"/>
    <circle cx="18.2" cy="10.8" r="2.6" fill="#ABBE83"/>
    <!-- center child (coral, tallest) -->
    <path d="M8.6 21 q0 -9.4 3.4 -9.4 q3.4 0 3.4 9.4 Z" fill="#E09972"/>
    <circle cx="12" cy="9.2" r="2.8" fill="#E09972"/>
  </g>
</svg>
