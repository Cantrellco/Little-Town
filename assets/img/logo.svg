<?xml version="1.0" encoding="UTF-8"?>
<!-- Little Town Playhouse logo emblem — placeholder in final brand style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Little Town Playhouse">
  <!-- ground -->
  <rect x="6" y="80" width="88" height="6" rx="3" fill="#e3d8c2"/>
  <!-- left teal house -->
  <rect x="10" y="50" width="26" height="32" rx="3" fill="#d6e6e2" stroke="#7FA8A0" stroke-width="2"/>
  <polygon points="7,50 23,36 39,50" fill="#7FA8A0"/>
  <rect x="19" y="64" width="8" height="18" rx="3" fill="#B5532E"/>
