<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="">
  <!-- left ladder rails -->
  <line x1="4" y1="6" x2="4" y2="20" stroke="#8A5A2C" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="7" y1="6" x2="7" y2="14" stroke="#8A5A2C" stroke-width="1.8" stroke-linecap="round"/>
  <!-- rungs -->
  <line x1="4" y1="9" x2="7" y2="9" stroke="#8A5A2C" stroke-width="1.4"/>
  <line x1="4" y1="12" x2="7" y2="12" stroke="#8A5A2C" stroke-width="1.4"/>
  <line x1="4" y1="15" x2="4.5" y2="15" stroke="#8A5A2C" stroke-width="1.4"/>
  <!-- slide curve (terracotta) -->
