<?xml version="1.0" encoding="UTF-8"?>
<!--
  Little Town Playhouse — hero town scene (polished)
  Placeholder illustration in final brand style; final art by brand illustrator.
  Flat storybook look with soft grounding shadows, gentle side-shading,
  framed windows and arched doors. SMIL animation (clouds, sun, flags, kids).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img"
     aria-label="An illustrated little town with children playing on a slide and along Main Street, past the café, grocery and clinic, with drifting clouds and fluttering flags.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f1ee"/><stop offset="0.7" stop-color="#f1f0e7"/><stop offset="1" stop-color="#F7F3EC"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7e6c4"/><stop offset="1" stop-color="#f0d49f"/>
    </radialGradient>
    <g id="tree">
      <ellipse cx="0" cy="86" rx="44" ry="9" fill="#7a8f63" opacity="0.18"/>
      <rect x="-7" y="44" width="14" height="44" rx="7" fill="#a9763e"/>
      <rect x="-7" y="44" width="5" height="44" rx="2.5" fill="#8a5e30" opacity="0.5"/>
      <circle cx="0" cy="22" r="42" fill="#9CB082"/>
      <circle cx="-24" cy="40" r="28" fill="#8aa070"/>
      <circle cx="24" cy="40" r="28" fill="#a7bb8e"/>
      <circle cx="-10" cy="14" r="20" fill="#aec291"/>
    </g>
    <g id="bush">
      <ellipse cx="0" cy="20" rx="42" ry="7" fill="#7a8f63" opacity="0.18"/>
      <circle cx="-18" cy="2" r="18" fill="#a7bb8e"/>
      <circle cx="0" cy="-8" r="22" fill="#9CB082"/>
      <circle cx="18" cy="2" r="18" fill="#8aa070"/>
      <rect x="-40" y="2" width="80" height="20" fill="#9CB082"/>
    </g>
    <g id="cloud">
      <circle cx="0" cy="0" r="24" fill="#fff"/><circle cx="28" cy="6" r="20" fill="#fff"/><circle cx="-26" cy="8" r="18" fill="#fff"/>
      <rect x="-44" y="2" width="92" height="22" rx="11" fill="#fff"/>
      <ellipse cx="-2" cy="20" rx="46" ry="7" fill="#dfeae6" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1200" height="640" fill="url(#sky)"/>

  <!-- sun with soft glow -->
  <circle cx="1060" cy="118" r="74" fill="#f6e3bf" opacity="0.45"><animate attributeName="r" values="74;80;74" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="118" r="50" fill="url(#sun)"><animate attributeName="r" values="50;53;50" dur="7s" repeatCount="indefinite"/></circle>

  <!-- clouds -->
  <use href="#cloud" x="250" y="120" opacity="0.96"><animateTransform attributeName="transform" type="translate" values="0 0;46 0;0 0" dur="20s" repeatCount="indefinite" additive="sum"/></use>
  <use href="#cloud" x="650" y="84" opacity="0.92"><animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="26s" repeatCount="indefinite" additive="sum"/></use>
  <use href="#cloud" x="940" y="186" opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;34 0;0 0" dur="32s" repeatCount="indefinite" additive="sum"/></use>

