<?xml version="1.0" encoding="UTF-8"?>
<!--
  Little Town Playhouse — hero town scene
  PLACEHOLDER ILLUSTRATION in final brand style.
  A polished, hand-illustrated version of this "mini downtown" skyline
  (slide/tunnel, Café, Open-Play storefront, Hospital, flagged tower)
  would be finalized by the brand illustrator. Colors use brand palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img"
     aria-label="An illustrated little town skyline with a play tunnel, café, grocery, hospital and a flagged tower among trees and bushes.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ef"/>
      <stop offset="1" stop-color="#F7F3EC"/>
    </linearGradient>
    <g id="tree">
      <rect x="-7" y="40" width="14" height="46" rx="6" fill="#a9763e"/>
      <circle cx="0" cy="22" r="42" fill="#9CB082"/>
      <circle cx="-22" cy="42" r="30" fill="#8aa070"/>
      <circle cx="22" cy="42" r="30" fill="#a7bb8e"/>
    </g>
    <g id="bush">
      <circle cx="-18" cy="0" r="18" fill="#a7bb8e"/>
      <circle cx="0" cy="-6" r="22" fill="#9CB082"/>
      <circle cx="18" cy="0" r="18" fill="#8aa070"/>
      <rect x="-40" y="0" width="80" height="24" fill="#9CB082"/>
    </g>
    <g id="cloud">
      <circle cx="0" cy="0" r="24" fill="#ffffff"/>
      <circle cx="28" cy="6" r="20" fill="#ffffff"/>
      <circle cx="-26" cy="8" r="18" fill="#ffffff"/>
      <rect x="-44" y="2" width="92" height="22" rx="11" fill="#ffffff"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="640" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1060" cy="120" r="58" fill="#f2d8a8"/>
  <circle cx="1060" cy="120" r="40" fill="#f6e3bf"/>

  <!-- clouds -->
  <use href="#cloud" x="230" y="120" opacity="0.95"/>
  <use href="#cloud" x="640" y="86" opacity="0.9"/>
  <use href="#cloud" x="940" y="180" opacity="0.85"/>

  <!-- rolling background hills -->
  <path d="M0 470 Q 250 405 520 460 T 1200 440 V640 H0 Z" fill="#e6ecdd"/>
  <path d="M0 520 Q 320 470 640 510 T 1200 500 V640 H0 Z" fill="#dbe5cf"/>

  <!-- ground / street -->
  <rect x="0" y="520" width="1200" height="120" fill="#efe7d8"/>
  <rect x="0" y="520" width="1200" height="8" fill="#e3d8c2"/>

  <!-- ===== Play tunnel / slide (teal) ===== -->
  <g>
    <path d="M250 520 Q235 470 175 470 L120 470 Q60 470 60 520 Z" fill="#cfe1dd"/>
    <ellipse cx="120" cy="500" rx="58" ry="34" fill="#7FA8A0"/>
    <ellipse cx="120" cy="500" rx="40" ry="24" fill="#5d8a82"/>
    <ellipse cx="120" cy="500" rx="22" ry="14" fill="#3f6a63"/>
    <!-- slide curve -->
    <path d="M250 470 Q330 420 330 520" fill="none" stroke="#9cc6bf" stroke-width="26" stroke-linecap="round"/>
    <path d="M250 470 Q330 420 330 520" fill="none" stroke="#7FA8A0" stroke-width="10" stroke-linecap="round"/>
    <use href="#bush" x="190" y="500"/>
  </g>

  <!-- ===== Café tower (wood tan) ===== -->
  <g>
    <rect x="300" y="320" width="150" height="200" rx="8" fill="#e7c389"/>
    <rect x="300" y="320" width="150" height="200" rx="8" fill="none" stroke="#d9a35e" stroke-width="3"/>
    <!-- roof -->
    <polygon points="290,320 375,236 460,320" fill="#c98f44"/>
    <polygon points="290,320 375,236 460,320" fill="none" stroke="#b07d35" stroke-width="2"/>
    <line x1="318" y1="312" x2="375" y2="256" stroke="#b07d35" stroke-width="2"/>
    <line x1="432" y1="312" x2="375" y2="256" stroke="#b07d35" stroke-width="2"/>
    <!-- flag -->
    <line x1="375" y1="236" x2="375" y2="196" stroke="#7a5a2e" stroke-width="4"/>
    <path d="M375 200 L412 210 L375 222 Z" fill="#D64A3F"/>
    <circle cx="375" cy="236" r="6" fill="#D9A35E"/>
    <!-- cup sign -->
    <g transform="translate(375,372)">
      <path d="M-24 -12 H20 V6 a18 18 0 0 1 -36 0 Z" fill="#fff"/>
      <path d="M20 -6 a12 12 0 0 1 0 18" fill="none" stroke="#fff" stroke-width="6"/>
      <path d="M-6 -28 q-6 6 0 12 M6 -28 q-6 6 0 12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- door -->
    <path d="M340 520 v-48 a30 30 0 0 1 60 0 v48 Z" transform="translate(5,0)" fill="#B5532E"/>
    <circle cx="360" cy="486" r="3.5" fill="#f1ddd3"/>
    <!-- windows -->
    <rect x="312" y="430" width="26" height="26" rx="5" fill="#dcebe8" />
    <rect x="312" y="430" width="26" height="26" rx="5" fill="#eef4f2"/>
    <rect x="412" y="430" width="26" height="26" rx="5" fill="#eef4f2"/>
  </g>

  <use href="#tree" x="490" y="430"/>

  <!-- ===== Open Play storefront (striped awning, sage) ===== -->
  <g>
    <rect x="540" y="360" width="190" height="160" rx="8" fill="#dfe7d2"/>
    <rect x="540" y="360" width="190" height="160" rx="8" fill="none" stroke="#9CB082" stroke-width="3"/>
    <!-- roof -->
    <rect x="528" y="344" width="214" height="22" rx="6" fill="#9CB082"/>
    <!-- awning -->
    <g>
      <path d="M540 392 H730 L716 420 H554 Z" fill="#ffffff"/>
      <path d="M554 392 H582 L575 420 H547 Z" fill="#9CB082"/>
      <path d="M610 392 H638 L631 420 H603 Z" fill="#9CB082"/>
      <path d="M666 392 H694 L687 420 H659 Z" fill="#9CB082"/>
    </g>
    <!-- door -->
    <path d="M600 520 v-44 a30 30 0 0 1 60 0 v44 Z" fill="#B5532E"/>
    <circle cx="650" cy="494" r="3.5" fill="#f1ddd3"/>
    <!-- shop windows -->
    <rect x="556" y="446" width="36" height="50" rx="6" fill="#eef4f2"/>
    <rect x="676" y="446" width="36" height="50" rx="6" fill="#eef4f2"/>
  </g>

  <use href="#bush" x="760" y="510"/>

  <!-- ===== Hospital (teal/sage, cross) ===== -->
  <g>
    <rect x="800" y="350" width="170" height="170" rx="8" fill="#d6e6e2"/>
    <rect x="800" y="350" width="170" height="170" rx="8" fill="none" stroke="#7FA8A0" stroke-width="3"/>
    <!-- roof -->
    <polygon points="788,350 885,290 982,350" fill="#7FA8A0"/>
    <!-- cross -->
    <g transform="translate(885,388)" fill="#fff">
      <rect x="-7" y="-20" width="14" height="40" rx="3"/>
      <rect x="-20" y="-7" width="40" height="14" rx="3"/>
    </g>
    <!-- door -->
    <path d="M848 520 v-44 a28 28 0 0 1 56 0 v44 Z" transform="translate(9,0)" fill="#3f7a52"/>
    <!-- windows -->
    <rect x="816" y="438" width="30" height="30" rx="6" fill="#eef4f2"/>
    <rect x="924" y="438" width="30" height="30" rx="6" fill="#eef4f2"/>
  </g>

  <!-- ===== Flagged tower (right) ===== -->
  <g>
    <rect x="1010" y="380" width="110" height="140" rx="8" fill="#e7c389"/>
    <rect x="1010" y="380" width="110" height="140" rx="8" fill="none" stroke="#d9a35e" stroke-width="3"/>
    <polygon points="1000,380 1065,316 1130,380" fill="#c98f44"/>
    <line x1="1065" y1="316" x2="1065" y2="280" stroke="#7a5a2e" stroke-width="4"/>
    <path d="M1065 284 L1100 294 L1065 305 Z" fill="#D64A3F"/>
    <circle cx="1065" cy="350" r="9" fill="#fff"/>
    <path d="M1040 520 v-40 a25 25 0 0 1 50 0 v40 Z" fill="#B5532E"/>
  </g>

  <use href="#tree" x="1160" y="450"/>

  <!-- foreground bushes -->
  <use href="#bush" x="430" y="528"/>
  <use href="#bush" x="980" y="526"/>
  <use href="#bush" x="40" y="540" />
</svg>
