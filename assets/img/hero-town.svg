<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero scene for DESKTOP (wide). Town sits low in the bottom third with open
  sky above for the headline. Flat colors (clean GIF), SMIL animation.
  Placeholder; final art by illustrator.
-->
