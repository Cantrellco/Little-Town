<?xml version="1.0" encoding="UTF-8"?>
<!-- Main-street row of imaginative-play storefronts. Placeholder, final art by illustrator. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img"
     aria-label="A little main street of imaginative-play shops: grocery, café tower and hospital, with trees and bushes.">
  <defs>
    <g id="ptree"><rect x="-6" y="34" width="12" height="40" rx="6" fill="#a9763e"/><circle cx="0" cy="18" r="34" fill="#9CB082"/><circle cx="-18" cy="34" r="24" fill="#8aa070"/><circle cx="18" cy="34" r="24" fill="#a7bb8e"/></g>
    <g id="pbush"><circle cx="-14" cy="0" r="14" fill="#a7bb8e"/><circle cx="0" cy="-5" r="17" fill="#9CB082"/><circle cx="14" cy="0" r="14" fill="#8aa070"/><rect x="-30" y="0" width="60" height="18" fill="#9CB082"/></g>
  </defs>
  <!-- ground -->
  <rect x="0" y="300" width="960" height="40" fill="#efe7d8"/>
  <rect x="0" y="300" width="960" height="6" fill="#e3d8c2"/>

  <!-- Grocery (awning) -->
  <g>
    <rect x="60" y="170" width="190" height="130" rx="8" fill="#dfe7d2" stroke="#9CB082" stroke-width="3"/>
    <rect x="48" y="154" width="214" height="20" rx="6" fill="#9CB082"/>
    <path d="M60 200 H250 L236 226 H74 Z" fill="#fff"/>
    <path d="M74 200 H100 L94 226 H68 Z" fill="#9CB082"/>
    <path d="M134 200 H160 L154 226 H128 Z" fill="#9CB082"/>
    <path d="M194 200 H220 L214 226 H188 Z" fill="#9CB082"/>
    <path d="M122 300 v-40 a28 28 0 0 1 56 0 v40 Z" fill="#B5532E"/>
    <rect x="78" y="244" width="32" height="44" rx="5" fill="#eef4f2"/>
    <rect x="200" y="244" width="32" height="44" rx="5" fill="#eef4f2"/>
  </g>

  <use href="#ptree" x="290" y="226"/>

  <!-- Café tower -->
  <g>
    <rect x="340" y="150" width="150" height="150" rx="8" fill="#e7c389" stroke="#D9A35E" stroke-width="3"/>
    <polygon points="330,150 415,84 500,150" fill="#c98f44"/>
    <line x1="415" y1="84" x2="415" y2="56" stroke="#7a5a2e" stroke-width="4"/>
    <path d="M415 60 L450 70 L415 80 Z" fill="#D64A3F"/>
    <g transform="translate(415,196)">
      <path d="M-22 -10 H18 V6 a16 16 0 0 1 -32 0 Z" fill="#fff"/>
      <path d="M18 -4 a11 11 0 0 1 0 16" fill="none" stroke="#fff" stroke-width="5"/>
    </g>
    <path d="M388 300 v-40 a27 27 0 0 1 54 0 v40 Z" fill="#B5532E"/>
    <rect x="352" y="240" width="24" height="24" rx="5" fill="#eef4f2"/>
    <rect x="454" y="240" width="24" height="24" rx="5" fill="#eef4f2"/>
  </g>

  <use href="#pbush" x="520" y="288"/>

  <!-- Hospital -->
  <g>
    <rect x="560" y="160" width="180" height="140" rx="8" fill="#d6e6e2" stroke="#7FA8A0" stroke-width="3"/>
    <polygon points="548,160 650,98 752,160" fill="#7FA8A0"/>
    <g transform="translate(650,140)" fill="#fff"><rect x="-7" y="-20" width="14" height="40" rx="3"/><rect x="-20" y="-7" width="40" height="14" rx="3"/></g>
    <path d="M620 300 v-42 a28 28 0 0 1 56 0 v42 Z" fill="#3f7a52"/>
    <rect x="576" y="232" width="30" height="30" rx="6" fill="#eef4f2"/>
    <rect x="694" y="232" width="30" height="30" rx="6" fill="#eef4f2"/>
  </g>

  <use href="#ptree" x="800" y="220"/>
  <use href="#pbush" x="880" y="290"/>
  <use href="#pbush" x="40" y="294"/>
</svg>
