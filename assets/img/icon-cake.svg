  <!-- candles -->
  <rect x="9.2" y="3.5" width="1.4" height="3.8" rx="0.3" fill="#A8472A"/>
  <rect x="13.4" y="3.5" width="1.4" height="3.8" rx="0.3" fill="#586A36"/>
  <!-- flames -->
  <path d="M9.9 2 q1 1 0 2 q-1 -1 0 -2 Z" fill="#E7BC76"/>
  <path d="M14.1 2 q1 1 0 2 q-1 -1 0 -2 Z" fill="#E7BC76"/>
  <!-- sprinkles on base -->
  <circle cx="8" cy="16.5" r="0.55" fill="#ABBE83"/>
  <circle cx="11.5" cy="17.5" r="0.55" fill="#E09972"/>
  <circle cx="15.5" cy="16.2" r="0.55" fill="#E7BC76"/>
  <circle cx="12.8" cy="15.5" r="0.45" fill="#A8472A"/>
</svg>
