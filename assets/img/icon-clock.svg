<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="">
  <!-- alarm-clock cap loop -->
  <path d="M8.6 4 q3.4 -3.4 6.8 0" fill="none" stroke="#8A5A2C" stroke-width="1.6" stroke-linecap="round"/>
  <!-- left foot -->
  <path d="M5 20 L4 22.5" stroke="#8A5A2C" stroke-width="1.6" stroke-linecap="round"/>
  <!-- right foot -->
  <path d="M19 20 L20 22.5" stroke="#8A5A2C" stroke-width="1.6" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="12" cy="13" r="9" fill="#FBF5EA" stroke="#8A5A2C" stroke-width="1.6"/>
  <!-- hour markers (12, 3, 6, 9) -->
  <path d="M12 5.4 V7" stroke="#8A5A2C" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M19.6 13 H18" stroke="#8A5A2C" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M12 20.6 V19" stroke="#8A5A2C" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M4.4 13 H6" stroke="#8A5A2C" stroke-width="1.3" stroke-linecap="round"/>
  <!-- hour hand pointing to 9 (open hour) -->
  <line x1="12" y1="13" x2="8.5" y2="13" stroke="#A8472A" stroke-width="1.9" stroke-linecap="round"/>
  <!-- minute hand pointing to 12 -->
  <line x1="12" y1="13" x2="12" y2="8.2" stroke="#A8472A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- centre pin -->
  <circle cx="12" cy="13" r="1.1" fill="#A8472A"/>
</svg>
