      <g fill="#9CB082"><rect x="158" y="628" width="20" height="22"/><rect x="198" y="628" width="20" height="22"/><rect x="238" y="628" width="20" height="22"/><rect x="278" y="628" width="20" height="22"/><rect x="318" y="628" width="20" height="22"/></g>
      <g><circle cx="170" cy="650" r="11" fill="#9CB082"/><circle cx="192" cy="650" r="11" fill="#fff"/><circle cx="214" cy="650" r="11" fill="#9CB082"/><circle cx="236" cy="650" r="11" fill="#fff"/><circle cx="258" cy="650" r="11" fill="#9CB082"/><circle cx="280" cy="650" r="11" fill="#fff"/><circle cx="302" cy="650" r="11" fill="#9CB082"/><circle cx="324" cy="650" r="11" fill="#fff"/></g>
      <rect x="158" y="624" width="180" height="6" rx="3" fill="#8aa070"/>
    </g>
    <path d="M186 780 v-50 a26 26 0 0 1 52 0 v50 Z" fill="#5b4a3a"/><circle cx="228" cy="744" r="3" fill="#e7c389"/>
    <path d="M262 780 v-50 a26 26 0 0 1 52 0 v50 Z" fill="#5b4a3a"/><circle cx="272" cy="744" r="3" fill="#e7c389"/>
  </g>

  <!-- Café tower -->
  <g>
    <ellipse cx="445" cy="784" rx="88" ry="9" fill="#7a8f63" opacity="0.12"/>
    <rect x="375" y="540" width="140" height="240" rx="6" fill="#f2e0a4"/>
    <rect x="487" y="540" width="28" height="240" rx="6" fill="#e6d088" opacity="0.5"/>
    <rect x="375" y="540" width="140" height="240" rx="6" fill="none" stroke="#e2c97e" stroke-width="3"/>
    <polygon points="363,542 445,468 527,542" fill="#cf9a4f"/><polygon points="445,468 527,542 479,542" fill="#b9803a"/>
    <g stroke="#b07d35" stroke-width="1.6" opacity="0.6"><line x1="391" y1="530" x2="445" y2="488"/><line x1="499" y1="530" x2="445" y2="488"/></g>
    <rect x="359" y="538" width="172" height="9" rx="4" fill="#b07d35"/>
    <line x1="445" y1="468" x2="445" y2="434" stroke="#7a5a2e" stroke-width="3.5"/>
    <circle cx="445" cy="468" r="5.5" fill="#E0A93F"/>
    <path d="M445 437 L483 447 L445 459 Z" fill="#D64A3F"/>
    <g transform="translate(445,612)"><path d="M-22 -14 H18 V4 a20 20 0 0 1 -40 0 Z" fill="#fff"/><path d="M18 -7 a13 13 0 0 1 0 22" fill="none" stroke="#fff" stroke-width="6"/><path d="M-7 -30 q-5 6 0 12 M6 -30 q-5 6 0 12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
    <path d="M411 780 v-46 a34 34 0 0 1 68 0 v46 Z" fill="#B5532E"/><path d="M411 780 v-46 a34 34 0 0 1 68 0 v46 Z" fill="none" stroke="#9a4526" stroke-width="3"/>
    <circle cx="463" cy="752" r="3.6" fill="#f1ddd3"/>
  </g>

  <!-- Clinic -->
  <g>
    <ellipse cx="630" cy="784" rx="110" ry="9" fill="#7a8f63" opacity="0.12"/>
    <rect x="540" y="606" width="190" height="174" rx="6" fill="#b7c79c"/>
    <rect x="702" y="606" width="28" height="174" rx="6" fill="#a7b98a" opacity="0.5"/>
    <rect x="540" y="606" width="190" height="174" rx="6" fill="none" stroke="#9fb286" stroke-width="3"/>
    <polygon points="524,608 635,548 746,608" fill="#c4d2ab"/><polygon points="635,548 746,608 690,608" fill="#aebd92"/>
    <rect x="520" y="604" width="230" height="9" rx="4" fill="#9fb286"/>
    <g transform="translate(635,576)" fill="#fff"><rect x="-6" y="-15" width="12" height="30" rx="3"/><rect x="-15" y="-6" width="30" height="12" rx="3"/></g>
    <rect x="540" y="628" width="190" height="14" fill="#fff" opacity="0.92"/>
    <path d="M603 780 v-46 a32 32 0 0 1 64 0 v46 Z" fill="#3f7a52"/><path d="M603 780 v-46 a32 32 0 0 1 64 0 v46 Z" fill="none" stroke="#356845" stroke-width="3"/>
    <circle cx="651" cy="756" r="3.6" fill="#dfeae3"/>
    <rect x="556" y="664" width="34" height="34" rx="4" fill="#fff"/><rect x="559" y="667" width="28" height="28" rx="2" fill="#eef4f2"/>
    <rect x="680" y="664" width="34" height="34" rx="4" fill="#fff"/><rect x="683" y="667" width="28" height="28" rx="2" fill="#eef4f2"/>
