<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero scene for PHONE (portrait), logo style. Town low, big sky for headline.
  Only the clouds animate; no children. Placeholder; final art by illustrator.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -300 760 1300" role="img"
     aria-label="An illustrated little town for phones — a play tunnel, market, café tower and clinic, with trees and drifting clouds.">
  <defs>
    <g id="mtree">
      <ellipse cx="0" cy="2" rx="26" ry="7" fill="#7a8f63" opacity="0.16"/>
      <rect x="-5" y="-48" width="10" height="50" rx="5" fill="#a9763e"/>
      <ellipse cx="0" cy="-72" rx="27" ry="40" fill="#9CB082"/><ellipse cx="0" cy="-82" rx="18" ry="27" fill="#a7bb8e"/>
    </g>
    <g id="mbush">
      <ellipse cx="0" cy="4" rx="30" ry="6" fill="#7a8f63" opacity="0.16"/>
      <circle cx="-12" cy="0" r="13" fill="#a7bb8e"/><circle cx="2" cy="-6" r="16" fill="#9CB082"/><circle cx="15" cy="0" r="12" fill="#8aa070"/>
    </g>
    <g id="mcloud">
      <circle cx="0" cy="0" r="22" fill="#fff"/><circle cx="26" cy="6" r="18" fill="#fff"/><circle cx="-24" cy="7" r="16" fill="#fff"/><rect x="-40" y="2" width="84" height="20" rx="10" fill="#fff"/>
      <ellipse cx="-2" cy="18" rx="42" ry="6" fill="#cfe2da" opacity="0.6"/>
    </g>
  </defs>

  <rect x="0" y="-300" width="760" height="1300" fill="#c5e2ec"/>

  <!-- clouds (only moving elements) -->
  <use href="#mcloud" x="170" y="-110"><animateTransform attributeName="transform" type="translate" values="0 0;38 0;0 0" dur="22s" repeatCount="indefinite" additive="sum"/></use>
  <use href="#mcloud" x="560" y="30" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="0 0;30 0;0 0" dur="28s" repeatCount="indefinite" additive="sum"/></use>

  <!-- hills -->
  <path d="M0 700 Q200 656 400 692 T760 682 V1000 H0 Z" fill="#dbe7cd"/>
  <path d="M0 736 Q230 700 470 728 T760 720 V1000 H0 Z" fill="#cfdcc0"/>

  <!-- ground line -->
  <rect x="40" y="780" width="680" height="5" rx="2.5" fill="#9CB082" opacity="0.55"/>

  <!-- play tunnel -->
  <g>
    <ellipse cx="95" cy="784" rx="68" ry="9" fill="#7a8f63" opacity="0.12"/>
    <ellipse cx="158" cy="700" rx="22" ry="28" fill="#9cc6bf"/>
    <ellipse cx="132" cy="716" rx="26" ry="32" fill="#b4d7d0"/>
    <ellipse cx="104" cy="734" rx="30" ry="36" fill="#9cc6bf"/>
    <ellipse cx="76" cy="754" rx="34" ry="41" fill="#b4d7d0"/>
    <ellipse cx="76" cy="754" rx="24" ry="31" fill="#7FA8A0"/>
    <ellipse cx="76" cy="754" rx="14" ry="20" fill="#3f6a63"/>
  </g>

  <!-- Market -->
  <g>
    <ellipse cx="248" cy="784" rx="110" ry="9" fill="#7a8f63" opacity="0.12"/>
    <rect x="158" y="620" width="180" height="160" rx="6" fill="#e7c389"/>
    <g stroke="#cf9a4f" stroke-width="1.5" opacity="0.7"><line x1="188" y1="620" x2="188" y2="780"/><line x1="218" y1="620" x2="218" y2="780"/><line x1="248" y1="620" x2="248" y2="780"/><line x1="278" y1="620" x2="278" y2="780"/><line x1="308" y1="620" x2="308" y2="780"/></g>
    <rect x="310" y="620" width="28" height="160" rx="6" fill="#d3a45f" opacity="0.4"/>
    <rect x="158" y="620" width="180" height="160" rx="6" fill="none" stroke="#cf9a4f" stroke-width="3"/>
    <polygon points="146,622 248,544 350,622" fill="#cf9a4f"/><polygon points="248,544 350,622 298,622" fill="#b9803a"/>
    <g stroke="#b07d35" stroke-width="1.6" opacity="0.6"><line x1="176" y1="610" x2="248" y2="562"/><line x1="320" y1="610" x2="248" y2="562"/></g>
    <rect x="142" y="618" width="212" height="9" rx="4" fill="#b07d35"/>
    <circle cx="248" cy="594" r="13" fill="#fbf3e6" stroke="#b9803a" stroke-width="2.5"/>
    <line x1="248" y1="544" x2="248" y2="510" stroke="#7a5a2e" stroke-width="3.5"/>
    <circle cx="248" cy="544" r="5.5" fill="#E0A93F"/>
    <path d="M248 513 L286 523 L248 535 Z" fill="#D64A3F"/>
    <g>
