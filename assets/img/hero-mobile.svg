<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero scene composed for PHONE (portrait). Same little-town idea as the
  desktop scene, arranged for a tall narrow screen with generous sky for the
  headline. Flat colors (clean GIF), SMIL animation. Placeholder; final art
  by illustrator.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -300 760 1300" role="img"
     aria-label="An illustrated little town for phones — a café tower, grocery and clinic with children, trees, drifting clouds and fluttering flags.">
