      <circle cx="0" cy="18" r="34" fill="#9CB082"/><circle cx="-20" cy="34" r="22" fill="#8aa070"/><circle cx="20" cy="34" r="22" fill="#a7bb8e"/><circle cx="-8" cy="10" r="16" fill="#aec291"/>
    </g>
    <g id="mbush">
