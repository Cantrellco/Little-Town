<?xml version="1.0" encoding="UTF-8"?>
<!-- Faint, tiling photo gallery texture — sparse and subtle, matching the
     Fusion coffee-bean tile's three-motif recipe (tiny camera, sparkle,
     polaroid). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130" role="presentation" aria-hidden="true">
  <g opacity="0.16" fill="#bb8350">
    <!-- camera -->
    <g transform="translate(34 38) rotate(-10)">
      <rect x="-12" y="-7" width="24" height="16" rx="3"/>
      <rect x="-5" y="-10.5" width="9" height="4" rx="1.3"/>
      <circle cx="2" cy="1" r="5"/>
    </g>
    <!-- sparkle -->
    <path transform="translate(96 70)" d="M0 -8 q1.3 6.4 8 8 q-6.7 1.6 -8 8 q-1.3 -6.4 -8 -8 q6.7 -1.6 8 -8Z"/>
    <!-- polaroid tilted -->
    <g transform="translate(60 104) rotate(8)">
      <rect x="-9" y="-9" width="18" height="20" rx="1.6"/>
      <rect x="-7" y="-7" width="14" height="11" rx="0.6" fill="#fff5e0"/>
    </g>
  </g>
</svg>
