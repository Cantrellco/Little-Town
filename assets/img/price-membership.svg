<?xml version="1.0" encoding="UTF-8"?>
<!-- Memberships hero art — a warm "family membership" card.
     Matches the site's hand-illustrated style: clay-brown linework
     (#8A5A2C, like the Fusion latte mug), warm gold fills, Fraunces
     wordmark, the page's signature sparkle motif, soft cast shadow,
     and a slight tilt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Little Town family membership card">
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FBE7BE"/>
      <stop offset="0.55" stop-color="#F0C97E"/>
      <stop offset="1"    stop-color="#E0A35F"/>
    </linearGradient>
    <radialGradient id="mc-badge" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#FFF6DE"/>
      <stop offset="1" stop-color="#F0CD83"/>
    </radialGradient>
  </defs>

  <!-- soft cast shadow under the card -->
  <ellipse cx="160" cy="204" rx="108" ry="7" fill="#3a2c20" opacity="0.16"/>

  <!-- card group (tilted as one) -->
  <g transform="rotate(-3 160 112)">
    <!-- body -->
    <rect x="36" y="34" width="248" height="156" rx="22" fill="url(#mc-bg)" stroke="#8A5A2C" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- top gloss -->
    <ellipse cx="132" cy="64" rx="96" ry="22" fill="#FBF5EA" opacity="0.14"/>

    <!-- emblem: badge + the page's signature 4-point sparkle -->
    <circle cx="80" cy="76" r="21" fill="url(#mc-badge)" stroke="#8A5A2C" stroke-width="2"/>
    <path transform="translate(63.8 63.9) scale(1.35)" d="M12 2c.5 4.5 2.5 6.5 7 7-4.5.5-6.5 2.5-7 7-.5-4.5-2.5-6.5-7-7 4.5-.5 6.5-2.5 7-7Z" fill="#C77F2E"/>
    <path transform="translate(63.8 63.9) scale(1.35)" d="M12 6c.3 2.5 1.5 3.7 4 4-2.5.3-3.7 1.5-4 4-.3-2.5-1.5-3.7-4-4 2.5-.3 3.7-1.5 4-4Z" fill="#FBF5EA" opacity="0.75"/>

    <!-- brand wordmark -->
    <text x="116" y="72" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#5a2f1c">Little Town</text>
    <text x="117" y="90" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="2.6" fill="#8A5A2C" opacity="0.82">FAMILY MEMBERSHIP</text>

    <!-- divider -->
    <line x1="60" y1="108" x2="260" y2="108" stroke="#8A5A2C" stroke-width="1.2" opacity="0.26"/>

    <!-- perk: heart + benefit -->
    <path transform="translate(65.4 125.4) scale(0.72)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D9663D" stroke="#8A5A2C" stroke-width="1.1" stroke-linejoin="round"/>
    <text x="92" y="139" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#5a2f1c">Unlimited play, every day</text>

    <!-- footer row -->
    <text x="60" y="173" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8A5A2C" opacity="0.9">YOUR FAMILY</text>
    <text x="224" y="173" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B35A37">2026</text>

    <!-- small sparkle on the card -->
    <path d="M236 150 l1 2.7 l2.9 0.3 l-2.2 1.8 l0.7 2.7 l-2.4 -1.6 l-2.4 1.6 l0.7 -2.7 l-2.2 -1.8 l2.9 -0.3 Z" fill="#FBF5EA" opacity="0.9"/>
  </g>

  <!-- ambient sparkles outside the card -->
  <path d="M34 60 l1.1 3 l3.2 0.3 l-2.4 2 l0.8 3.1 l-2.7 -1.7 l-2.7 1.7 l0.8 -3.1 l-2.4 -2 l3.2 -0.3 Z" fill="#FBF5EA" opacity="0.85"/>
  <path d="M288 164 l1.2 3.2 l3.4 0.4 l-2.6 2.1 l0.85 3.2 l-2.9 -1.8 l-2.9 1.8 l0.85 -3.2 l-2.6 -2.1 l3.4 -0.4 Z" fill="#FBF5EA" opacity="0.8"/>
</svg>
