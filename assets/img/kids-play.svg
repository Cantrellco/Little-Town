    <path d="M848 300 q-8 -40 4 -56 q14 22 6 56 Z" fill="#8aa070"><animateTransform attributeName="transform" type="rotate" values="-5 850 300;6 850 300;-5 850 300" dur="5.2s" repeatCount="indefinite"/></path>
