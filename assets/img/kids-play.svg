  <defs>
    <linearGradient id="winsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebe8"/><stop offset="1" stop-color="#eef4f2"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f5f1"/><stop offset="1" stop-color="#e9f1ec"/></linearGradient>
    <clipPath id="winclip"><rect x="372" y="52" width="156" height="100" rx="10"/></clipPath>
  </defs>

  <!-- room -->
  <rect width="900" height="380" fill="url(#wall)"/>
  <rect x="0" y="300" width="900" height="80" fill="#e7d6b8"/>
  <rect x="0" y="300" width="900" height="80" fill="#dcc8a4" opacity="0.35"/>
  <rect x="0" y="300" width="900" height="6" fill="#d3bd95"/>
  <ellipse cx="450" cy="332" rx="370" ry="30" fill="#dbe5cf" opacity="0.6"/>

  <!-- window with little-town view -->
  <rect x="358" y="38" width="184" height="126" rx="18" fill="#fff"/>
  <rect x="362" y="42" width="176" height="120" rx="16" fill="#eaf1ee"/>
  <rect x="372" y="52" width="156" height="100" rx="10" fill="url(#winsky)"/>
  <g clip-path="url(#winclip)">
    <circle cx="500" cy="74" r="15" fill="#f4dcae"/>
    <g fill="#cdddbb">
      <g transform="translate(398,0)"><rect x="0" y="118" width="26" height="34" rx="3"/><polygon points="-4,118 13,100 30,118"/></g>
      <g transform="translate(444,0)"><rect x="0" y="110" width="24" height="42" rx="3"/><polygon points="-4,110 12,92 28,110"/></g>
      <g transform="translate(486,0)"><rect x="0" y="120" width="28" height="32" rx="3"/><polygon points="-4,120 14,102 32,120"/></g>
    </g>
  </g>
  <line x1="450" y1="52" x2="450" y2="152" stroke="#fff" stroke-width="6"/><line x1="372" y1="102" x2="528" y2="102" stroke="#fff" stroke-width="6"/>

  <!-- bunting -->
  <path d="M40 30 Q450 64 860 30" fill="none" stroke="#cdbfa6" stroke-width="2"/>
  <g>
    <path d="M150 40 l14 1 l-7 15 Z" fill="#D64A3F"/><path d="M240 47 l14 1 l-7 15 Z" fill="#7FA8A0"/>
    <path d="M650 47 l14 1 l-7 15 Z" fill="#9CB082"/><path d="M740 40 l14 1 l-7 15 Z" fill="#D9A35E"/>
  </g>

  <!-- play tunnel -->
  <g>
    <ellipse cx="120" cy="320" rx="80" ry="12" fill="#7a8f63" opacity="0.12"/>
    <ellipse cx="120" cy="280" rx="68" ry="44" fill="#9cc6bf"/>
    <ellipse cx="120" cy="280" rx="50" ry="32" fill="#7FA8A0"/>
    <ellipse cx="120" cy="280" rx="31" ry="20" fill="#3f6a63"/>
