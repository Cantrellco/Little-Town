    <ellipse cx="-9" cy="2" rx="7" ry="4" fill="#8a3f23"/><ellipse cx="9" cy="2" rx="7" ry="4" fill="#8a3f23"/>
    <rect x="-13" y="-28" width="10" height="30" rx="5" fill="#e0a878" transform="rotate(-8 -8 -14)"/><rect x="3" y="-28" width="10" height="30" rx="5" fill="#e0a878" transform="rotate(8 8 -14)"/>
    <path d="M-20 -62 Q0 -70 20 -62 L16 -26 Q0 -22 -16 -26 Z" fill="#B5532E"/>
    <path d="M-34 -76 q-10 8 -8 24" stroke="#B5532E" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M34 -76 q10 8 8 24" stroke="#B5532E" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="-42" cy="-54" r="6" fill="#d9a36f"/><circle cx="42" cy="-54" r="6" fill="#d9a36f"/>
    <circle cx="0" cy="-80" r="17" fill="#d9a36f"/>
    <path d="M-17 -82 a17 17 0 0 1 34 0 q-17 -14 -34 0Z" fill="#2f2a24"/>
    <circle cx="-6" cy="-79" r="2.1" fill="#221c16"/><circle cx="6" cy="-79" r="2.1" fill="#221c16"/>
