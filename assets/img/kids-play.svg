  <rect x="250" y="252" width="60" height="60" rx="14" fill="none" stroke="#c0892f" stroke-width="2"/>
  <rect x="296" y="276" width="46" height="36" rx="11" fill="#9CB082"/><rect x="296" y="276" width="46" height="36" rx="11" fill="none" stroke="#86a06b" stroke-width="2"/>

