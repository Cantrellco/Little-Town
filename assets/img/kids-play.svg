    <ellipse cx="0" cy="4" rx="22" ry="6" fill="#7a8f63" opacity="0.14"/>
    <ellipse cx="-7" cy="1" rx="7" ry="4" fill="#5b4632"/><ellipse cx="8" cy="1" rx="7" ry="4" fill="#5b4632"/>
    <rect x="-12" y="-26" width="10" height="27" rx="5" fill="#c98a5a"/><rect x="2" y="-26" width="10" height="27" rx="5" fill="#c98a5a"/>
    <path d="M-17 -56 Q0 -64 17 -56 L14 -24 Q0 -20 -14 -24 Z" fill="#D64A3F"/>
    <path d="M-30 -54 q-8 6 -8 18" stroke="#D64A3F" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M22 -62 q10 -4 14 -14" stroke="#D64A3F" stroke-width="11" fill="none" stroke-linecap="round"/>
    <circle cx="-38" cy="-34" r="5.5" fill="#a9743f"/><circle cx="37" cy="-78" r="5.5" fill="#a9743f"/>
    <circle cx="0" cy="-72" r="15" fill="#a9743f"/>
    <path d="M-15 -74 a15 15 0 0 1 30 0 q-15 -12 -30 0Z" fill="#2f2a24"/>
    <circle cx="-5" cy="-71" r="1.9" fill="#221c16"/><circle cx="5" cy="-71" r="1.9" fill="#221c16"/>
    <circle cx="-9" cy="-66" r="2.4" fill="#8a5638" opacity="0.5"/><circle cx="9" cy="-66" r="2.4" fill="#8a5638" opacity="0.5"/>
    <path d="M-5 -65 q5 4 10 0" stroke="#221c16" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M37 -86 q-2 30 -11 50" stroke="#cdbfa6" stroke-width="1.6" fill="none"/>
    <ellipse cx="42" cy="-104" rx="16" ry="20" fill="#7FA8A0"/><ellipse cx="36" cy="-110" rx="4" ry="6" fill="#fff" opacity="0.5"/>
