  <g transform="translate(300,320)">
    <ellipse cx="6" cy="8" rx="34" ry="7" fill="#7a8f63" opacity="0.14"/>
    <ellipse cx="0" cy="-8" rx="27" ry="15" fill="#9CB082"/>
    <ellipse cx="0" cy="-12" rx="27" ry="8" fill="#a7bb8e" opacity="0.6"/>
    <rect x="-23" y="-15" width="11" height="20" rx="5.5" fill="#9CB082"/><rect x="13" y="-15" width="11" height="20" rx="5.5" fill="#9CB082"/>
    <circle cx="-18" cy="6" r="5" fill="#f0c9a8"/><circle cx="18" cy="6" r="5" fill="#f0c9a8"/>
    <circle cx="32" cy="-22" r="14" fill="#f0c9a8"/>
    <path d="M18 -24 a14 14 0 0 1 28 0 q-14 -11 -28 0Z" fill="#c98f44"/>
    <circle cx="34" cy="-22" r="1.8" fill="#3a2f24"/>
    <circle cx="29" cy="-17" r="2.3" fill="#eaa98e" opacity="0.6"/>
