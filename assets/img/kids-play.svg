<?xml version="1.0" encoding="UTF-8"?>
<!--
  Children playing inside the playhouse (polished). Placeholder; final art by illustrator.
  Flat storybook look, soft grounding, friendly kid figures. SMIL animation.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
