  <!-- sparkles -->
  <g fill="#D9A35E">
    <path d="M560 70 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></path>
    <path d="M330 110 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.4s" repeatCount="indefinite"/></path>
