  <ellipse cx="150" cy="194" rx="92" ry="9" fill="#7a8f63" opacity="0.12"/>
  <rect x="20" y="188" width="260" height="5" rx="2.5" fill="#9CB082" opacity="0.5"/>
  <!-- bunting strung corner-to-corner, with hanging flags -->
  <path d="M6 24 Q150 60 294 24" fill="none" stroke="#cdbfa6" stroke-width="2"/>
  <g>
    <path d="M28 30.5 L42 30.5 L35 44.5 Z" fill="#de5347"/>
    <path d="M71 37.5 L85 37.5 L78 51.5 Z" fill="#7fa8a0"/>
    <path d="M114 41.3 L128 41.3 L121 55.3 Z" fill="#9CB082"/>
    <path d="M143 42 L157 42 L150 56 Z" fill="#e6b54a"/>
    <path d="M172 41.3 L186 41.3 L179 55.3 Z" fill="#9CB082"/>
    <path d="M215 37.5 L229 37.5 L222 51.5 Z" fill="#7fa8a0"/>
    <path d="M258 30.5 L272 30.5 L265 44.5 Z" fill="#de5347"/>
  </g>
  <!-- balloons -->
