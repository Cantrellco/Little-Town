  <ellipse cx="244" cy="108" rx="15" ry="19" fill="#7fa8a0"/><ellipse cx="239" cy="102" rx="4" ry="5" fill="#fff" opacity="0.4"/><path d="M244 127 q-3 8 2 16" stroke="#cdbfa6" stroke-width="1.5" fill="none"/>
  <!-- tower -->
  <rect x="112" y="86" width="100" height="102" rx="6" fill="#d9a96a"/>
  <g stroke="#c8964f" stroke-width="1.6" opacity="0.5"><line x1="140" y1="86" x2="140" y2="188"/><line x1="162" y1="86" x2="162" y2="188"/><line x1="184" y1="86" x2="184" y2="188"/></g>
  <rect x="188" y="86" width="24" height="102" rx="6" fill="#c8964f" opacity="0.4"/>
