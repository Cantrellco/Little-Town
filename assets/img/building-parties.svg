  <polygon points="100,88 162,30 224,88" fill="#cda063"/><polygon points="162,30 224,88 188,88" fill="#b5823f"/>
  <g stroke="#9c6c30" stroke-width="1.6" opacity="0.45"><line x1="124" y1="76" x2="200" y2="76"/><line x1="138" y1="62" x2="186" y2="62"/></g>
