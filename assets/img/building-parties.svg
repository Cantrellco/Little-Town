  <circle cx="162" cy="62" r="11" fill="#fbf3e6" stroke="#b5823f" stroke-width="2.2"/>
  <line x1="162" y1="30" x2="162" y2="10" stroke="#7a5a2e" stroke-width="3"/>
  <circle cx="162" cy="30" r="5" fill="#e6b54a"/>
  <path d="M162 11 L194 20 L162 30 Z" fill="#de5347"/>
  <path d="M138 188 v-34 a24 24 0 0 1 48 0 v34 Z" fill="#b5532e"/><path d="M138 188 v-34 a24 24 0 0 1 48 0 v34 Z" fill="none" stroke="#9a4526" stroke-width="3"/>
