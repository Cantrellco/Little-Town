<?xml version="1.0" encoding="UTF-8"?>
<!-- Household Family Pass hero art — a warm "one pass for the whole house" card.
     Same hand-illustrated family as price-membership.svg / price-buyout.svg:
     warm gold card, clay-brown linework (#8A5A2C), Fraunces wordmark, signature
     4-point sparkles, soft cast shadow, slight tilt. Themed for a household pass:
     a little house emblem + a trio of siblings (icon-family palette) peeking over
     the top edge. Price-agnostic on purpose — $75/household is a placeholder and
     terms are TBD; do not put a visit count or price on the art. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Little Town Household Family Pass card">
  <defs>
    <linearGradient id="hf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FBE7BE"/>
      <stop offset="0.55" stop-color="#F0C97E"/>
      <stop offset="1"    stop-color="#E0A35F"/>
    </linearGradient>
    <radialGradient id="hf-badge" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#FFF6DE"/>
      <stop offset="1" stop-color="#F0CD83"/>
    </radialGradient>
  </defs>

  <!-- ambient confetti (bunting palette, kept to the corners) -->
  <g opacity="0.9">
    <rect x="36" y="40" width="11" height="15" rx="2" fill="#F8D98F" transform="rotate(18 41 47)"/>
    <polygon points="60,96 72,96 66,85" fill="#BFD6A8"/>
    <circle cx="44" cy="120" r="4.5" fill="#AEDCEA"/>
    <rect x="312" y="120" width="11" height="15" rx="2" fill="#F4AE92" transform="rotate(-16 317 127)"/>
    <circle cx="332" cy="86" r="4.5" fill="#EC9A90"/>
    <polygon points="300,250 312,250 306,239" fill="#F8D98F"/>
    <circle cx="52" cy="252" r="4.5" fill="#F4AE92"/>
  </g>

  <!-- soft cast shadow under the card -->
  <ellipse cx="180" cy="282" rx="120" ry="8" fill="#3a2c20" opacity="0.16"/>

  <!-- siblings peeking over the top-right edge (drawn behind the card) -->
  <g stroke="#8A5A2C" stroke-width="2" stroke-linejoin="round">
    <!-- gold kid (back-left) -->
    <path d="M236 150 q0 -56 16 -56 q16 0 16 56 Z" fill="#E7BC76"/>
    <circle cx="252" cy="84" r="12.5" fill="#E7BC76"/>
    <!-- coral kid (back-right, tallest) -->
    <path d="M270 150 q0 -60 16 -60 q16 0 16 60 Z" fill="#E09972"/>
    <circle cx="286" cy="80" r="13" fill="#E09972"/>
    <!-- green kid (front-center, smallest) -->
    <path d="M256 150 q0 -48 14 -48 q14 0 14 48 Z" fill="#ABBE83"/>
    <circle cx="270" cy="92" r="11" fill="#ABBE83"/>
  </g>
  <!-- highlights + little faces -->
  <g stroke="none">
    <ellipse cx="247" cy="79" rx="3.1" ry="4.2" fill="#FBF5EA" opacity="0.45"/>
    <ellipse cx="281" cy="75" rx="3.1" ry="4.2" fill="#FBF5EA" opacity="0.45"/>
    <ellipse cx="265" cy="88" rx="2.6" ry="3.5" fill="#FBF5EA" opacity="0.45"/>
    <!-- gold face -->
    <circle cx="248.5" cy="85" r="1.5" fill="#5a2f1c"/><circle cx="255.5" cy="85" r="1.5" fill="#5a2f1c"/>
    <!-- coral face -->
    <circle cx="282.5" cy="81" r="1.6" fill="#5a2f1c"/><circle cx="289.5" cy="81" r="1.6" fill="#5a2f1c"/>
    <!-- green face -->
    <circle cx="267" cy="93" r="1.4" fill="#5a2f1c"/><circle cx="273" cy="93" r="1.4" fill="#5a2f1c"/>
  </g>
  <g fill="none" stroke="#5a2f1c" stroke-linecap="round">
    <path d="M248.5 89 q3.5 2.6 7 0" stroke-width="1.4"/>
    <path d="M282.5 85 q3.5 2.6 7 0" stroke-width="1.4"/>
    <path d="M267 96 q3 2.2 6 0" stroke-width="1.3"/>
  </g>

  <!-- card group (tilted as one) -->
  <g transform="rotate(-3 180 188)">
    <!-- body -->
    <rect x="40" y="108" width="280" height="160" rx="22" fill="url(#hf-bg)" stroke="#8A5A2C" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- top gloss -->
    <ellipse cx="138" cy="138" rx="104" ry="22" fill="#FBF5EA" opacity="0.14"/>

    <!-- emblem badge + little house -->
    <circle cx="80" cy="150" r="21" fill="url(#hf-badge)" stroke="#8A5A2C" stroke-width="2"/>
    <polygon points="66,151 80,138 94,151" fill="#D9663D" stroke="#8A5A2C" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="71" y="150" width="18" height="15" rx="2" fill="#FBF5EA" stroke="#8A5A2C" stroke-width="1.6"/>
    <rect x="77" y="157" width="6" height="8" rx="1" fill="#E09972" stroke="#8A5A2C" stroke-width="1.1"/>

    <!-- brand wordmark -->
    <text x="116" y="146" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#5a2f1c">Household Pass</text>
    <text x="117" y="164" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.4" fill="#8A5A2C" opacity="0.82">FOR THE WHOLE FAMILY</text>

    <!-- divider -->
    <line x1="62" y1="184" x2="298" y2="184" stroke="#8A5A2C" stroke-width="1.2" opacity="0.26"/>

    <!-- perk: heart + benefit -->
    <path transform="translate(63 197) scale(0.78)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D9663D" stroke="#8A5A2C" stroke-width="1.1" stroke-linejoin="round"/>
    <text x="92" y="210" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#5a2f1c">Every kid in one household</text>

    <!-- footer row -->
    <text x="62" y="246" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8A5A2C" opacity="0.9">2 OR MORE KIDS</text>
    <text x="262" y="246" font-family="Quicksand, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B35A37">2026</text>

    <!-- small sparkle on the card -->
    <path d="M274 198 l1 2.7 l2.9 0.3 l-2.2 1.8 l0.7 2.7 l-2.4 -1.6 l-2.4 1.6 l0.7 -2.7 l-2.2 -1.8 l2.9 -0.3 Z" fill="#FBF5EA" opacity="0.9"/>
  </g>

  <!-- little hands gripping the card rim (on top of the card edge) -->
  <g stroke="#8A5A2C" stroke-width="1.5">
    <circle cx="245" cy="105" r="3.1" fill="#E7BC76"/>
    <circle cx="259" cy="106" r="3.1" fill="#E7BC76"/>
    <circle cx="280" cy="101" r="3.3" fill="#E09972"/>
    <circle cx="294" cy="102" r="3.3" fill="#E09972"/>
    <circle cx="265" cy="111" r="2.9" fill="#ABBE83"/>
    <circle cx="277" cy="111" r="2.9" fill="#ABBE83"/>
  </g>

  <!-- ambient sparkles outside the card -->
  <path d="M40 92 l1.1 3 l3.2 0.3 l-2.4 2 l0.8 3.1 l-2.7 -1.7 l-2.7 1.7 l0.8 -3.1 l-2.4 -2 l3.2 -0.3 Z" fill="#F4AE92" opacity="0.9"/>
  <path d="M318 232 l1.2 3.2 l3.4 0.4 l-2.6 2.1 l0.85 3.2 l-2.9 -1.8 l-2.9 1.8 l0.85 -3.2 l-2.6 -2.1 l3.4 -0.4 Z" fill="#AEDCEA" opacity="0.85"/>
  <path d="M214 30 l1 2.7 l2.9 0.3 l-2.2 1.8 l0.7 2.7 l-2.4 -1.6 l-2.4 1.6 l0.7 -2.7 l-2.2 -1.8 l2.9 -0.3 Z" fill="#BFD6A8" opacity="0.9"/>
</svg>
